services:

  ma-base-de-donnees:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: taches_db
    ports:
      - "5432:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data

volumes:
  donnees-postgres:
